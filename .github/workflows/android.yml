name: Android

# Builds the Android app (android/) and keeps the installable test build as an artifact.
# Only runs when the app changes; the website's checks and deploys are in ci.yml.
on:
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - run: gradle --no-daemon :app:assembleDebug
        working-directory: android
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk badminton-test-${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v7
        with:
          name: badminton-test-apk
          path: badminton-test-*.apk
          retention-days: 30
