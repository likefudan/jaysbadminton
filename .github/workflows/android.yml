name: Android

# Builds the Android app (android/) and keeps the installable test build as an artifact.
# Only runs when the app changes; the website's checks and deploys are in ci.yml.
on:
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: "8.13"
      # The test key lives in the repository's secrets, never in the repository. Without the
      # secrets (a fork's PR) the build is signed with a throwaway debug key instead.
      - name: Test signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_TEST_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_TEST_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/test.keystore"
            echo "ANDROID_TEST_KEYSTORE=$RUNNER_TEMP/test.keystore" >> "$GITHUB_ENV"
            echo "ANDROID_TEST_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "No test signing key in the secrets: signing with a throwaway debug key."
          fi
      - run: gradle --no-daemon :app:assembleDebug
        working-directory: android
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk badminton-test-${{ github.run_number }}.apk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: badminton-test-apk
          path: badminton-test-*.apk
          retention-days: 30
