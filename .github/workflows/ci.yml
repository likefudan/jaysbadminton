name: CI

# Pull requests: checks only.
# Merge to main: checks, then deploy to the test site (staging.jaysbadminton.llmat.dev).
# Push a release tag v* (e.g. v2026.10.05): checks, back up the database, deploy to production.
# Run workflow by hand: on main → redeploys staging; on a v* tag → redeploys that release to
#   production (this is also how to roll back: run it on the previous tag).
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      reset_admin_link:
        description: "Invalidate the admin link so /admin offers first-time setup again (needs ADMIN_PASSWORD)"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Browser tests (main flows on a local Worker)
        run: |
          npx playwright install --with-deps chromium
          npx playwright test
        env:
          WRANGLER_SEND_METRICS: "false"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  deploy-staging:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency: deploy-staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/resolve-d1.mjs staging
      - run: npx wrangler d1 migrations apply DB --remote --env staging
      - run: npx wrangler deploy --env staging
      - run: node scripts/sync-secrets.mjs staging
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD_STAGING || secrets.ADMIN_PASSWORD }}
          # Its own bot: a bot has one webhook, so sharing production's would steal its replies.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN_STAGING }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
      - if: inputs.reset_admin_link
        run: npx wrangler d1 execute DB --remote --env staging --command "DELETE FROM settings WHERE key IN ('admin_token_hash', 'admin_token_enc')"
      - name: Smoke test the test site
        run: node scripts/smoke.mjs
        env:
          SITE_ORIGIN: https://staging.jaysbadminton.llmat.dev

  deploy-production:
    needs: check
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency: deploy-production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Release must be a commit on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::${GITHUB_REF_NAME} is not on main; only merged, tested code is released"
            exit 1
          }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/resolve-d1.mjs production
      - name: Back up the production database
        run: |
          mkdir -p backup
          npx wrangler d1 export DB --remote --output "backup/jaysbadminton-${GITHUB_REF_NAME}-$(date -u +%Y%m%dT%H%M%SZ).sql"
      - uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.ref_name }}-${{ github.run_attempt }}
          path: backup/
          retention-days: 90
      - run: npx wrangler d1 migrations apply DB --remote
      - run: npx wrangler deploy
      - run: node scripts/sync-secrets.mjs production
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
      - if: inputs.reset_admin_link
        run: npx wrangler d1 execute DB --remote --command "DELETE FROM settings WHERE key IN ('admin_token_hash', 'admin_token_enc')"
      - name: Smoke test the live site
        run: node scripts/smoke.mjs
