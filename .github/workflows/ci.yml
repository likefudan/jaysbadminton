name: CI

# Pull requests: checks only.
# Merge to main: checks, then deploy to the test site (staging.jaysbadminton.llmat.dev).
# Push a release tag v* (e.g. v2026.10.05): checks, back up the database, deploy to production,
#   then the same for each extra site in sites.json.
# Run workflow by hand: on main → redeploys staging; on a v* tag → deploys that release to the
#   production sites named in `sites` (all of them by default). This is also how a site catches up
#   to an older release or rolls back: run it on that tag with that site. A site whose database has
#   run migrations the tag does not have is refused (scripts/check-migrations.mjs). `tested` skips
#   the tests when this commit already passed them on main (the Release workflow checks that), so a
#   rollback is not held up, or blocked, by re-running an old release's tests.
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      reset_admin_link:
        description: "Invalidate the admin link so /admin offers first-time setup again. On main: the test site. On a v* tag: production. Set up again with the current admin password (ADMIN_PASSWORD / ADMIN_PASSWORD_STAGING unless changed in settings)"
        type: boolean
        default: false
      sites:
        description: "On a v* tag: which production sites to deploy. all = every site; or ids separated by commas: jays (Jay's site), then the ids in sites.json (e.g. sbbc, bewithyou, coco)"
        type: string
        default: all
      tested:
        description: "On a v* tag: skip the tests because this commit already passed them on main (Release sets this for an existing version)"
        type: boolean
        default: false

# Read-only token: nothing here writes to the repository (deploys use the Cloudflare token).
permissions:
  contents: read

# Deploys of one tag to different sites may run side by side; each site has its own deploy lock below.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.sites }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Unit tests (in two halves) and the browser tests run side by side; deploys wait for all of them.
  check:
    if: ${{ !(inputs.tested && startsWith(github.ref, 'refs/tags/v')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # node_modules as npm ci left it for this exact lockfile; npm ci runs only when there is none.
      - uses: actions/cache@v6
        id: deps
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}
      - if: steps.deps.outputs.cache-hit != 'true'
        run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # The runner has 2 CPUs, so Vitest would default to one worker and run the files one by one.
      # Half the test files here, the other half in unit-2 at the same time.
      - run: npm test -- --maxWorkers=2 --shard=1/2

  unit-2:
    if: ${{ !(inputs.tested && startsWith(github.ref, 'refs/tags/v')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # node_modules as npm ci left it for this exact lockfile; npm ci runs only when there is none.
      - uses: actions/cache@v6
        id: deps
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}
      - if: steps.deps.outputs.cache-hit != 'true'
        run: npm ci
      - run: npm test -- --maxWorkers=2 --shard=2/2

  # The browser tests in two halves at the same time: e2e runs flows.spec.ts, e2e-2 all the others.
  e2e:
    name: ${{ matrix.shard == 1 && 'e2e' || 'e2e-2' }}
    if: ${{ !(inputs.tested && startsWith(github.ref, 'refs/tags/v')) }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # node_modules as npm ci left it for this exact lockfile; npm ci runs only when there is none.
      - uses: actions/cache@v6
        id: deps
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}
      - if: steps.deps.outputs.cache-hit != 'true'
        run: npm ci
      - run: npm run build
      - name: Playwright version
        id: pw
        run: echo "version=$(node -p 'require("@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"
      # A cached browser needs no system packages (12s of apt): the runner image already has
      # Chromium's libraries, and the extra fonts don't matter to tests that check text.
      # A cache miss (new Playwright version) installs both, so it never depends on that.
      - uses: actions/cache@v6
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Browser tests (main flows on a local Worker)
        run: npx playwright test ${{ matrix.shard == 1 && 'flows' || '' }}
        env:
          WRANGLER_SEND_METRICS: "false"
          E2E_SKIP_FLOWS: ${{ matrix.shard == 2 && '1' || '' }}
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  deploy-staging:
    needs: [check, unit-2, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency: deploy-staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # node_modules as npm ci left it for this exact lockfile; npm ci runs only when there is none.
      - uses: actions/cache@v6
        id: deps
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}
      - if: steps.deps.outputs.cache-hit != 'true'
        run: npm ci
      - run: npm run build
      - run: node scripts/resolve-d1.mjs staging
      - run: npx wrangler d1 migrations apply DB --remote --env staging
      - run: npx wrangler deploy --env staging --var "APP_VERSION:main-${GITHUB_SHA:0:7}"
      - run: node scripts/sync-secrets.mjs staging
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD_STAGING || secrets.ADMIN_PASSWORD }}
          # Backup of the test site's own TOKEN_KEY (never production's): checked, and put back if lost.
          LINK_ENCRYPTION_KEY: ${{ secrets.LINK_ENCRYPTION_KEY_STAGING }}
          # Its own bot: a bot has one webhook, so sharing production's would steal its replies.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN_STAGING }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          # Same OAuth client; its redirect URIs must also list the staging callback.
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          AZURE_FOUNDRY_API_KEY: ${{ secrets.AZURE_FOUNDRY_API_KEY }}
      - if: inputs.reset_admin_link
        run: npx wrangler d1 execute DB --remote --env staging --command "DELETE FROM settings WHERE key IN ('admin_token_hash', 'admin_token_enc')"
      - name: Smoke test the test site
        run: node scripts/smoke.mjs
        env:
          SITE_ORIGIN: https://staging.jaysbadminton.llmat.dev

  # The release site badminton.llmat.dev (ops/): Ke Li's page for releasing to chosen sites. A tool,
  # not part of a release, so it follows main. Its failure does not turn CI on main red (a release needs
  # that green, and the tool must not hold releases up); the developers' Telegram group hears of it.
  deploy-ops:
    needs: [check, unit-2, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    concurrency: deploy-ops
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@v6
        id: deps
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}
      - if: steps.deps.outputs.cache-hit != 'true'
        run: npm ci
      - run: npx wrangler deploy --config ops/wrangler.jsonc
      - run: node scripts/sync-ops-secrets.mjs
        env:
          # Fine-grained token for this repository only: Actions read and write, Contents read.
          OPS_GITHUB_TOKEN: ${{ secrets.OPS_GITHUB_TOKEN }}
          # The one Google account allowed in.
          OPS_EMAIL: ${{ secrets.OPS_EMAIL }}
          # Same OAuth client; its redirect URIs must also list https://badminton.llmat.dev/auth/callback.
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          # The developers' group hears of every sign-in and every release started from the site.
          TELEGRAM_DEV_BOT_TOKEN: ${{ secrets.TELEGRAM_DEV_BOT_TOKEN }}
          TELEGRAM_DEV_CHAT_ID: ${{ secrets.TELEGRAM_DEV_CHAT_ID }}
      - name: Smoke test the release site
        run: |
          # Up to 3 minutes: a new domain's certificate takes a while.
          for i in $(seq 18); do
            curl -fsS https://badminton.llmat.dev/health && exit 0
            sleep 10
          done
          exit 1
      - name: Tell the developers when it failed
        if: failure()
        env:
          TELEGRAM_DEV_BOT_TOKEN: ${{ secrets.TELEGRAM_DEV_BOT_TOKEN }}
          TELEGRAM_DEV_CHAT_ID: ${{ secrets.TELEGRAM_DEV_CHAT_ID }}
        run: |
          scripts/notify-dev.sh "$(printf '⚠️ 发布管理网站 badminton.llmat.dev 部署失败（不影响正式站发布）：\n%s/%s/actions/runs/%s' \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")"

  # Which production sites this release goes to (the `sites` input; every site on a tag push).
  plan:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      main: ${{ steps.plan.outputs.main }}
      sites: ${{ steps.plan.outputs.sites }}
      chosen: ${{ steps.plan.outputs.chosen }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            scripts
            sites.json
          sparse-checkout-cone-mode: false
      # The release site reads the chosen sites from this step's name to show their progress.
      - name: "Sites: ${{ inputs.sites || 'all' }}"
        id: plan
        env:
          SITES: ${{ inputs.sites }}
          READY: ${{ secrets.SITES_KEY != '' && secrets.SITES_ADMIN_PASSWORD != '' }}
        run: |
          node scripts/release-plan.mjs
          echo "Sites: $(grep -h '^chosen=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2-)" >> "$GITHUB_STEP_SUMMARY"

  deploy-production:
    needs: [check, unit-2, e2e, plan]
    if: >-
      !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.main == 'true' &&
      (inputs.tested ||
       (needs.check.result == 'success' && needs.unit-2.result == 'success' && needs.e2e.result == 'success'))
    runs-on: ubuntu-latest
    concurrency: deploy-production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Release must be a commit on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::${GITHUB_REF_NAME} is not on main; only merged, tested code is released"
            exit 1
          }
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # Production always installs from scratch, not from the node_modules cache the tests use.
      - run: npm ci
      - run: npm run build
      - run: node scripts/resolve-d1.mjs production
      - name: The database is not newer than this release
        run: node scripts/check-migrations.mjs
      # Encrypted with BACKUP_KEY: the plain SQL never leaves this runner.
      - name: Back up the production database
        run: scripts/backup-db.sh "jaysbadminton-${GITHUB_REF_NAME}-$(date -u +%Y%m%dT%H%M%SZ)"
        env:
          BACKUP_KEY: ${{ secrets.BACKUP_KEY }}
      - uses: actions/upload-artifact@v7
        with:
          name: db-encrypted-${{ github.ref_name }}-${{ github.run_attempt }}
          path: backup/
          retention-days: 90
      - run: npx wrangler d1 migrations apply DB --remote
      - run: npx wrangler deploy --var "APP_VERSION:${GITHUB_REF_NAME}"
      - run: node scripts/sync-secrets.mjs production
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          # Backup of TOKEN_KEY: checked, and put back if lost.
          LINK_ENCRYPTION_KEY: ${{ secrets.LINK_ENCRYPTION_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          AZURE_FOUNDRY_API_KEY: ${{ secrets.AZURE_FOUNDRY_API_KEY }}
      - if: inputs.reset_admin_link
        run: npx wrangler d1 execute DB --remote --command "DELETE FROM settings WHERE key IN ('admin_token_hash', 'admin_token_enc')"
      - name: Smoke test the live site
        run: node scripts/smoke.mjs
      # 正式版发布通知: the Owner and the admins hear in Telegram what this release changed.
      # Only for the newest release, once; a failure here never fails the deploy.
      - name: Tell the Owner and admins
        continue-on-error: true
        run: node scripts/release-notice.mjs

  # The other production sites in sites.json (each group's own site) chosen for this release, after
  # Jay's when it is chosen too (it goes first as the canary; if it fails, they wait). Each is backed up,
  # migrated and deployed on its own, so one site failing leaves the others deployed.
  # Off until the shared GitHub secrets SITES_KEY and SITES_ADMIN_PASSWORD exist (release-plan.mjs).
  deploy-sites:
    needs: [check, unit-2, e2e, plan, deploy-production]
    if: >-
      !cancelled() && needs.plan.outputs.sites != '[]' && needs.plan.result == 'success' &&
      (inputs.tested ||
       (needs.check.result == 'success' && needs.unit-2.result == 'success' && needs.e2e.result == 'success')) &&
      (needs.deploy-production.result == 'success' ||
       (needs.deploy-production.result == 'skipped' && needs.plan.outputs.main != 'true'))
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        site: ${{ fromJSON(needs.plan.outputs.sites) }}
    concurrency: deploy-site-${{ matrix.site }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CONFIG: wrangler.${{ matrix.site }}.json
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Release must be a commit on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::${GITHUB_REF_NAME} is not on main; only merged, tested code is released"
            exit 1
          }
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/site-config.mjs ${{ matrix.site }}
      - name: The database is not newer than this release
        run: node scripts/check-migrations.mjs --config "$CONFIG"
      - name: Back up the site's database
        run: scripts/backup-db.sh "jaysbadminton-${{ matrix.site }}-${GITHUB_REF_NAME}-$(date -u +%Y%m%dT%H%M%SZ)" --config "$CONFIG"
        env:
          BACKUP_KEY: ${{ secrets.BACKUP_KEY }}
      - uses: actions/upload-artifact@v7
        with:
          name: db-encrypted-${{ matrix.site }}-${{ github.ref_name }}-${{ github.run_attempt }}
          path: backup/
          retention-days: 90
      - run: npx wrangler d1 migrations apply DB --remote --config "$CONFIG"
      - run: npx wrangler deploy --config "$CONFIG" --var "APP_VERSION:${GITHUB_REF_NAME}"
      - run: node scripts/sync-secrets.mjs site ${{ matrix.site }}
        env:
          ADMIN_PASSWORD: ${{ secrets.SITES_ADMIN_PASSWORD }}
          SITES_KEY: ${{ secrets.SITES_KEY }}
          # No TELEGRAM_BOT_TOKEN: each site's Owner saves their own bot in 设置.
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          # Same OAuth client; its redirect URIs must also list this site's callback.
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          AZURE_FOUNDRY_API_KEY: ${{ secrets.AZURE_FOUNDRY_API_KEY }}
      # site-config.mjs set SITE_ORIGIN for the steps below.
      - name: Smoke test the site
        run: node scripts/smoke.mjs
      - name: Tell the site's Owner and admins
        continue-on-error: true
        run: node scripts/release-notice.mjs
        env:
          WRANGLER_CONFIG: ${{ env.CONFIG }}

  # One message to the developers' Telegram group with every production site's result: Jay's site
  # and each site in sites.json, ✓ / ✗ / not deployed / not chosen. Runs whatever happened above, so
  # a release that failed its tests or stopped on one site is reported too.
  notify-release:
    needs: [plan, deploy-production, deploy-sites]
    if: always() && startsWith(github.ref, 'refs/tags/v') && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # this run's job results
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            scripts
            sites.json
            wrangler.jsonc
          sparse-checkout-cone-mode: false
      - name: Tell the developers
        env:
          GH_TOKEN: ${{ github.token }}
          CHOSEN: ${{ needs.plan.outputs.chosen }}
          TELEGRAM_DEV_BOT_TOKEN: ${{ secrets.TELEGRAM_DEV_BOT_TOKEN }}
          TELEGRAM_DEV_CHAT_ID: ${{ secrets.TELEGRAM_DEV_CHAT_ID }}
        run: |
          text=$(node scripts/release-summary.mjs) ||
            text=$(printf '⚠️ %s 的发布结果读取失败，请查看：\n%s/%s/actions/runs/%s' \
              "$GITHUB_REF_NAME" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
          scripts/notify-dev.sh "$text"
