name: CI

# Pull requests: checks only.
# Merge to main: checks, then deploy to the test site (staging.jaysbadminton.llmat.dev).
# Push a release tag v* (e.g. v2026.10.05): checks, back up the database, deploy to production,
#   then the same for each extra site in sites.json.
# Run workflow by hand: on main → redeploys staging; on a v* tag → redeploys that release to
#   production (this is also how to roll back: run it on the previous tag).
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      reset_admin_link:
        description: "Invalidate the admin link so /admin offers first-time setup again. On main: the test site. On a v* tag: production. Set up again with the current admin password (ADMIN_PASSWORD / ADMIN_PASSWORD_STAGING unless changed in settings)"
        type: boolean
        default: false

# Read-only token: nothing here writes to the repository (deploys use the Cloudflare token).
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Unit tests (in two halves) and the browser tests run side by side; deploys wait for all of them.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # node_modules as npm ci left it for this exact lockfile; npm ci runs only when there is none.
      - uses: actions/cache@v6
        id: deps
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}
      - if: steps.deps.outputs.cache-hit != 'true'
        run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # The runner has 2 CPUs, so Vitest would default to one worker and run the files one by one.
      # Half the test files here, the other half in unit-2 at the same time.
      - run: npm test -- --maxWorkers=2 --shard=1/2

  unit-2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # node_modules as npm ci left it for this exact lockfile; npm ci runs only when there is none.
      - uses: actions/cache@v6
        id: deps
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}
      - if: steps.deps.outputs.cache-hit != 'true'
        run: npm ci
      - run: npm test -- --maxWorkers=2 --shard=2/2

  # The browser tests in two halves at the same time: e2e runs flows.spec.ts, e2e-2 all the others.
  e2e:
    name: ${{ matrix.shard == 1 && 'e2e' || 'e2e-2' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # node_modules as npm ci left it for this exact lockfile; npm ci runs only when there is none.
      - uses: actions/cache@v6
        id: deps
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}
      - if: steps.deps.outputs.cache-hit != 'true'
        run: npm ci
      - run: npm run build
      - name: Playwright version
        id: pw
        run: echo "version=$(node -p 'require("@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"
      # A cached browser needs no system packages (12s of apt): the runner image already has
      # Chromium's libraries, and the extra fonts don't matter to tests that check text.
      # A cache miss (new Playwright version) installs both, so it never depends on that.
      - uses: actions/cache@v6
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Browser tests (main flows on a local Worker)
        run: npx playwright test ${{ matrix.shard == 1 && 'flows' || '' }}
        env:
          WRANGLER_SEND_METRICS: "false"
          E2E_SKIP_FLOWS: ${{ matrix.shard == 2 && '1' || '' }}
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  deploy-staging:
    needs: [check, unit-2, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency: deploy-staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # node_modules as npm ci left it for this exact lockfile; npm ci runs only when there is none.
      - uses: actions/cache@v6
        id: deps
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}
      - if: steps.deps.outputs.cache-hit != 'true'
        run: npm ci
      - run: npm run build
      - run: node scripts/resolve-d1.mjs staging
      - run: npx wrangler d1 migrations apply DB --remote --env staging
      - run: npx wrangler deploy --env staging
      - run: node scripts/sync-secrets.mjs staging
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD_STAGING || secrets.ADMIN_PASSWORD }}
          # Backup of the test site's own TOKEN_KEY (never production's): checked, and put back if lost.
          LINK_ENCRYPTION_KEY: ${{ secrets.LINK_ENCRYPTION_KEY_STAGING }}
          # Its own bot: a bot has one webhook, so sharing production's would steal its replies.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN_STAGING }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          # Same OAuth client; its redirect URIs must also list the staging callback.
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
          AZURE_FOUNDRY_API_KEY: ${{ secrets.AZURE_FOUNDRY_API_KEY }}
      - if: inputs.reset_admin_link
        run: npx wrangler d1 execute DB --remote --env staging --command "DELETE FROM settings WHERE key IN ('admin_token_hash', 'admin_token_enc')"
      - name: Smoke test the test site
        run: node scripts/smoke.mjs
        env:
          SITE_ORIGIN: https://staging.jaysbadminton.llmat.dev

  deploy-production:
    needs: [check, unit-2, e2e]
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency: deploy-production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Release must be a commit on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::${GITHUB_REF_NAME} is not on main; only merged, tested code is released"
            exit 1
          }
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # Production always installs from scratch, not from the node_modules cache the tests use.
      - run: npm ci
      - run: npm run build
      - run: node scripts/resolve-d1.mjs production
      - name: Back up the production database
        run: |
          mkdir -p backup
          npx wrangler d1 export DB --remote --output "backup/jaysbadminton-${GITHUB_REF_NAME}-$(date -u +%Y%m%dT%H%M%SZ).sql"
      - uses: actions/upload-artifact@v7
        with:
          name: db-backup-${{ github.ref_name }}-${{ github.run_attempt }}
          path: backup/
          retention-days: 90
      - run: npx wrangler d1 migrations apply DB --remote
      - run: npx wrangler deploy
      - run: node scripts/sync-secrets.mjs production
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          # Backup of TOKEN_KEY: checked, and put back if lost.
          LINK_ENCRYPTION_KEY: ${{ secrets.LINK_ENCRYPTION_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
          AZURE_FOUNDRY_API_KEY: ${{ secrets.AZURE_FOUNDRY_API_KEY }}
      - if: inputs.reset_admin_link
        run: npx wrangler d1 execute DB --remote --command "DELETE FROM settings WHERE key IN ('admin_token_hash', 'admin_token_enc')"
      - name: Smoke test the live site
        run: node scripts/smoke.mjs
      # 正式版发布通知: the Owner and the admins hear in Telegram what this release changed.
      # Only for the newest release, once; a failure here never fails the deploy.
      - name: Tell the Owner and admins
        continue-on-error: true
        run: node scripts/release-notice.mjs

  # The other production sites in sites.json (each group's own site), after Jay's on every release: each
  # is backed up, migrated and deployed on its own, so one site failing leaves the others deployed.
  # Off until the shared GitHub secrets SITES_KEY and SITES_ADMIN_PASSWORD exist.
  list-sites:
    needs: deploy-production
    runs-on: ubuntu-latest
    outputs:
      ids: ${{ steps.list.outputs.ids }}
    steps:
      - uses: actions/checkout@v7
      - id: list
        env:
          READY: ${{ secrets.SITES_KEY != '' && secrets.SITES_ADMIN_PASSWORD != '' }}
        run: |
          if [ "$READY" != true ]; then
            echo "::warning::SITES_KEY or SITES_ADMIN_PASSWORD is not set: the sites in sites.json are not deployed"
            echo 'ids=[]' >> "$GITHUB_OUTPUT"
          else
            echo "ids=$(jq -c '[.[].id]' sites.json)" >> "$GITHUB_OUTPUT"
          fi

  deploy-sites:
    needs: list-sites
    if: needs.list-sites.outputs.ids != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        site: ${{ fromJSON(needs.list-sites.outputs.ids) }}
    concurrency: deploy-site-${{ matrix.site }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CONFIG: wrangler.${{ matrix.site }}.json
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/site-config.mjs ${{ matrix.site }}
      - name: Back up the site's database
        run: |
          mkdir -p backup
          npx wrangler d1 export DB --remote --config "$CONFIG" --output "backup/jaysbadminton-${{ matrix.site }}-${GITHUB_REF_NAME}-$(date -u +%Y%m%dT%H%M%SZ).sql"
      - uses: actions/upload-artifact@v7
        with:
          name: db-backup-${{ matrix.site }}-${{ github.ref_name }}-${{ github.run_attempt }}
          path: backup/
          retention-days: 90
      - run: npx wrangler d1 migrations apply DB --remote --config "$CONFIG"
      - run: npx wrangler deploy --config "$CONFIG"
      - run: node scripts/sync-secrets.mjs site ${{ matrix.site }}
        env:
          ADMIN_PASSWORD: ${{ secrets.SITES_ADMIN_PASSWORD }}
          SITES_KEY: ${{ secrets.SITES_KEY }}
          # No TELEGRAM_BOT_TOKEN: each site's Owner saves their own bot in 设置.
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          # Same OAuth client; its redirect URIs must also list this site's callback.
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          # Same Turnstile widget; its hostnames must also list this site.
          TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
          AZURE_FOUNDRY_API_KEY: ${{ secrets.AZURE_FOUNDRY_API_KEY }}
      # site-config.mjs set SITE_ORIGIN for the steps below.
      - name: Smoke test the site
        run: node scripts/smoke.mjs
      - name: Tell the site's Owner and admins
        continue-on-error: true
        run: node scripts/release-notice.mjs
        env:
          WRANGLER_CONFIG: ${{ env.CONFIG }}

  # One message to the developers' Telegram group with every production site's result: Jay's site
  # and each site in sites.json, ✓ / ✗ / not deployed. Runs whatever happened above, so a release
  # that failed its tests or stopped on one site is reported too.
  notify-release:
    needs: [deploy-production, list-sites, deploy-sites]
    if: always() && startsWith(github.ref, 'refs/tags/v') && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # this run's job results
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            scripts
            sites.json
            wrangler.jsonc
          sparse-checkout-cone-mode: false
      - name: Tell the developers
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_DEV_BOT_TOKEN: ${{ secrets.TELEGRAM_DEV_BOT_TOKEN }}
          TELEGRAM_DEV_CHAT_ID: ${{ secrets.TELEGRAM_DEV_CHAT_ID }}
        run: |
          text=$(node scripts/release-summary.mjs) ||
            text=$(printf '⚠️ %s 的发布结果读取失败，请查看：\n%s/%s/actions/runs/%s' \
              "$GITHUB_REF_NAME" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
          scripts/notify-dev.sh "$text"
