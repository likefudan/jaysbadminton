name: Delete old US East databases

# One-off (Ke Li 2026-11-18: 美东数据库请删除). Jay's site and staging moved to US West on 2026-11-14
# (jaysbadminton-wnam, jaysbadminton-staging-wnam); the US East originals were kept as a way back and
# are no longer bound to any Worker. Deletes exactly those two, by name AND id, and nothing else.
# Releases older than v2026.11.14.3 looked the database up by the old name, so they must not be
# released again after this.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  delete:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/delete-old-d1.mjs
