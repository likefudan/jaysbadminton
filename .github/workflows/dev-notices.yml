name: Dev notices

# Tells the developers' Telegram group about every PR merged into main (the test site deploys
# right after). Releases are announced by the notify-release job in ci.yml.
# pull_request_target runs this repository's own copy of the workflow with its secrets, also for
# PRs from forks; it never checks out or runs the PR's code, and the PR's text only reaches the
# message through environment variables.
on:
  pull_request_target:
    types: [closed]
    branches: [main]

permissions:
  contents: read

jobs:
  merged:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7 # main as it is now, not the PR
        with:
          sparse-checkout: scripts/notify-dev.sh
          sparse-checkout-cone-mode: false
      - name: Post to Telegram
        env:
          TELEGRAM_DEV_BOT_TOKEN: ${{ secrets.TELEGRAM_DEV_BOT_TOKEN }}
          TELEGRAM_DEV_CHAT_ID: ${{ secrets.TELEGRAM_DEV_CHAT_ID }}
          NUMBER: ${{ github.event.pull_request.number }}
          TITLE: ${{ github.event.pull_request.title }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          MERGER: ${{ github.event.pull_request.merged_by.login }}
          FILES: ${{ github.event.pull_request.changed_files }}
          ADDED: ${{ github.event.pull_request.additions }}
          REMOVED: ${{ github.event.pull_request.deletions }}
          URL: ${{ github.event.pull_request.html_url }}
        run: |
          text=$(printf '✅ PR #%s 已合并\n%s\n\n作者：%s · 合并：%s\n改动：%s 个文件，+%s −%s\n%s\n\n测试环境正在自动部署：https://staging.jaysbadminton.llmat.dev' \
            "$NUMBER" "$TITLE" "$AUTHOR" "$MERGER" "$FILES" "$ADDED" "$REMOVED" "$URL")
          scripts/notify-dev.sh "$text"
