# One-off experiment (not part of the site): read the test photos with the new Azure deployments.
name: model-test
on:
  push:
    branches: [claude/project-thread-03p5v3]
    paths: [experiments/model-test/**, .github/workflows/model-test.yml]
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node experiments/model-test/run.mjs
        env:
          AZURE_FOUNDRY_API_KEY: ${{ secrets.AZURE_FOUNDRY_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREFIX: tmp-model-test-
          RUNS: "2"
