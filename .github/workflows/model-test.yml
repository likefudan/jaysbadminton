# One-off experiment (not part of the site): every Azure deployment through the site's askAi.
name: model-test
on:
  push:
    branches: [claude/project-thread-03p5v3]
    paths: [experiments/model-test/**, .github/workflows/model-test.yml]
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx esbuild experiments/model-test/all.ts --bundle --platform=node --format=esm --outfile=/tmp/all.mjs
      - run: node /tmp/all.mjs
        env:
          AZURE_FOUNDRY_API_KEY: ${{ secrets.AZURE_FOUNDRY_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
