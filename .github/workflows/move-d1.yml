name: Move database

# One-off: copy the test site's D1 database into a new one in US West (scripts/move-d1.mjs), then
# deploy the test site so it uses the copy. `undo` deletes the copy and deploys again, back on the
# old database. Actions → Move database → Run workflow on main.
on:
  workflow_dispatch:
    inputs:
      undo:
        description: "撤销：删掉美西的新库，测试站回到原来的库"
        type: boolean
        default: false

permissions:
  contents: read
  actions: write # start CI on main afterwards: its deploy-staging job switches the test site over

# Not while the test site is being deployed: that deploy picks the database by name.
concurrency: deploy-staging

jobs:
  move:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Only from main
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then echo "::error::Run Move database on main"; exit 1; fi
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/move-d1.mjs staging ${{ inputs.undo && 'undo' || '' }}
      - name: Deploy the test site
        run: gh workflow run ci.yml --ref main --repo "$GITHUB_REPOSITORY"
