name: Purge unencrypted backups

# Run once by hand (Actions → Purge unencrypted backups → Run workflow, on main). Until 2026-11-10
# every release uploaded each site's database as a PLAIN SQL artifact (db-backup-…), and the
# repository's artifacts can be downloaded by anyone. This first takes a fresh ENCRYPTED backup of
# every site (db-encrypted-…, scripts/backup-db.sh), then deletes every db-backup-… artifact.
# Nothing is deleted unless all the new backups succeeded.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency: purge-plain-backups

jobs:
  backup-production:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: deploy-production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/resolve-d1.mjs production
      - run: scripts/backup-db.sh "jaysbadminton-before-purge-$(date -u +%Y%m%dT%H%M%SZ)"
        env:
          BACKUP_KEY: ${{ secrets.BACKUP_KEY }}
      - uses: actions/upload-artifact@v7
        with:
          name: db-encrypted-before-purge-${{ github.run_id }}
          path: backup/
          retention-days: 90

  backup-sites:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        site: [sbbc, bewithyou, coco]
    concurrency: deploy-site-${{ matrix.site }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - name: Same list as sites.json
        run: jq -e --arg id "${{ matrix.site }}" 'any(.[]; .id == $id)' sites.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/site-config.mjs ${{ matrix.site }}
      - run: scripts/backup-db.sh "jaysbadminton-${{ matrix.site }}-before-purge-$(date -u +%Y%m%dT%H%M%SZ)" --config "wrangler.${{ matrix.site }}.json"
        env:
          BACKUP_KEY: ${{ secrets.BACKUP_KEY }}
      - uses: actions/upload-artifact@v7
        with:
          name: db-encrypted-${{ matrix.site }}-before-purge-${{ github.run_id }}
          path: backup/
          retention-days: 90

  purge:
    needs: [backup-production, backup-sites]
    runs-on: ubuntu-latest
    permissions:
      actions: write # delete artifacts
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Delete every unencrypted database backup
        run: |
          ids=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name | startswith("db-backup-")) | "\(.id) \(.name)"')
          if [ -z "$ids" ]; then echo "No unencrypted backups left"; exit 0; fi
          echo "$ids" | while read -r id name; do
            echo "Deleting $name ($id)"
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/$id"
          done
          left=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '[.artifacts[] | select(.name | startswith("db-backup-"))] | length' | paste -sd+ | bc)
          echo "Unencrypted backups left: $left"
          [ "$left" = 0 ]
