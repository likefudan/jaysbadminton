name: Weekly backup

# Every site's production database, encrypted into the private R2 bucket (scripts/backup-db.sh), once
# a week: releases back up too, but a quiet month has no release. Backups are deleted after 90 days.
# Also by hand: Actions → Weekly backup → Run workflow, on main.
on:
  workflow_dispatch:
  schedule:
    # Mondays 10:23 UTC (early morning Pacific): nobody is playing.
    - cron: "23 10 * * 1"

permissions:
  contents: read

concurrency: weekly-backup

jobs:
  backup-production:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/resolve-d1.mjs production
      - run: scripts/backup-db.sh "jaysbadminton-weekly-$(date -u +%Y%m%dT%H%M%SZ)"
        env:
          BACKUP_KEY: ${{ secrets.BACKUP_KEY }}

  sites:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      ids: ${{ steps.ids.outputs.ids }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: ids
        run: echo "ids=$(jq -c 'map(.id)' sites.json)" >> "$GITHUB_OUTPUT"

  backup-sites:
    needs: sites
    runs-on: ubuntu-latest
    strategy:
      # One site failing must not stop the others' backups.
      fail-fast: false
      matrix:
        site: ${{ fromJSON(needs.sites.outputs.ids) }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/site-config.mjs ${{ matrix.site }}
      - run: scripts/backup-db.sh "jaysbadminton-${{ matrix.site }}-weekly-$(date -u +%Y%m%dT%H%M%SZ)" --config "wrangler.${{ matrix.site }}.json"
        env:
          BACKUP_KEY: ${{ secrets.BACKUP_KEY }}
