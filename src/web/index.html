<!doctype html>
<html lang="zh-CN" data-style="minimal" data-accent="coral" data-mode="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#f7f4ef" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Jay's 羽毛球</title>
    <script>
      // Apply the remembered appearance before the first paint (site.ts keeps it up to date).
      (function () {
        var d = document.documentElement;
        try {
          var old = { lagoon: "minimal-coral", ocean: "minimal-ocean", grape: "minimal-grape", sunset: "minimal-coral", sakura: "aurora-sunset", forest: "minimal-forest", graphite: "minimal-ocean" };
          var t = localStorage.getItem("my-theme") || localStorage.getItem("site-theme") || "minimal-coral";
          t = old[t] || t;
          var p = t.split("-");
          if (p.length === 2) {
            d.setAttribute("data-style", p[0]);
            d.setAttribute("data-accent", p[1]);
          }
        } catch (e) {}
        var m = null;
        try {
          m = localStorage.getItem("my-mode");
        } catch (e) {}
        if (m !== "light" && m !== "dark") m = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        d.setAttribute("data-mode", m);
      })();
    </script>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="羽毛球" />
    <meta name="description" content="报名、结算、付款，一个链接搞定。" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Jay's 羽毛球" />
    <meta property="og:description" content="报名、结算、付款，一个链接搞定。" />
    <meta property="og:image" content="https://jaysbadminton.llmat.dev/og-image.jpg" />
  </head>
  <body>
    <!-- Older WeChat versions take a link preview's picture from the first large image on the page. -->
    <img src="/og-image.jpg" alt="" width="1" height="1" style="position: absolute; left: -9999px" />
    <div id="app"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
