<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e29a7b"/>
      <stop offset="1" stop-color="#bf6f52"/>
    </linearGradient>
    <clipPath id="head"><ellipse cx="0" cy="0" rx="62" ry="84"/></clipPath>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- swing trail -->
  <g fill="none" stroke="#fff" stroke-linecap="round">
    <path d="M84 300 A220 220 0 0 1 160 92" stroke-width="18" opacity=".38"/>
    <path d="M126 330 A180 180 0 0 1 178 150" stroke-width="12" opacity=".24"/>
  </g>
  <!-- racket -->
  <g transform="translate(262 262) scale(1.28) rotate(38)">
    <g clip-path="url(#head)" stroke="#fff" stroke-width="4" opacity=".75">
      <path d="M-40 -120V120M-20 -120V120M0 -120V120M20 -120V120M40 -120V120"/>
      <path d="M-80 -60H80M-80 -40H80M-80 -20H80M-80 0H80M-80 20H80M-80 40H80M-80 60H80"/>
    </g>
    <ellipse cx="0" cy="-0" rx="62" ry="84" fill="none" stroke="#fff" stroke-width="17"/>
    <path d="M-16 80 L0 112 L16 80" fill="none" stroke="#fff" stroke-width="10" stroke-linejoin="round"/>
    <rect x="-6" y="108" width="12" height="62" rx="6" fill="#fff"/>
    <rect x="-14" y="166" width="28" height="64" rx="12" fill="#fff"/>
  </g>
  <!-- shuttlecock flying off -->
  <g transform="translate(418 108) scale(.9) rotate(-42)">
    <path d="M-20 -10 L-34 -58 L34 -58 L20 -10 Z" fill="#fff" opacity=".92"/>
    <path d="M-17 -52 L-8 -12 M0 -56 L0 -12 M17 -52 L8 -12" stroke="#bf6f52" stroke-width="4" opacity=".5"/>
    <circle cx="0" cy="0" r="16" fill="#fff"/>
  </g>
</svg>
